[project]
name = "nexow-agents"
version = "0.1.0"
description = "Nexow agent management service - AI reasoning and strategy templates"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic-ai>=0.0.14",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "nexow-shared @ git+ssh://git@github.com/nexow-ai/nexow-shared.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
